services:
  etcd:
    image: milvusdb/etcd:3.5.30-r1
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_DATA_DIR=/bitnami/etcd/data
    volumes:
      - ./volumes/etcd:/bitnami/etcd
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./volumes/minio:/data
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.3
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    command: [ "milvus", "run", "standalone" ]

  attu:
    image: zilliz/attu:v3.0.1
    environment:
      MILVUS_ADDRESS: milvus:19530
      ATTU_AUTH_MODE: none
    ports:
      - "8002:3000"
    depends_on:
      - "milvus"
